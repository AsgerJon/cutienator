# Minor release candidate: the release-candidate button of the minor level.
# Publishes the next release candidate of the locked minor release
# (X.Y.Z-rcN) to PyPI as a pre-release. Manual trigger only, and run from
# 'main' alone. The release state machine in
# 'bin/release_tooling/release_state.py' decides every press from
# 'bin/release_tooling/VERSION': the first release candidate, rc0, closes
# the dev cycle of its level for good and runs only when
# 'bin/release_tooling/minor-rc.safety' read 'ALLOW' in the commit the
# button was pressed on, while a later one needs no safety; see the
# 'safety' job.
on:
  workflow_dispatch:

jobs:
  safety:
    # The guard. It refuses a press on any branch but 'main' before it
    # reads or writes anything. On 'main' it decides the press from VERSION
    # and, for a press that needs one, from the safety of this button, both
    # as committed in the commit the button was pressed on; locks every
    # safety back to 'STOP'; pushes the lock; tests the release tooling;
    # and only then fails or lets the test matrix start. A refused run
    # therefore still leaves every safety locked in the repository, and an
    # arming is spent by the press of the button whatever the run does
    # next.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the locked safeties
    steps:
      # The default checkout is the commit the button was pressed on, so
      # the state of VERSION and of the safety at that moment decides.
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Decide and lock
        run: python bin/release_tooling/safety_check.py minor-rc SAFETY_VERDICT
      - name: Push the lock
        run: |
          git config user.name "Asger Jon Vistisen"
          git config user.email "asgerjon2@gmail.com"
          git add bin/release_tooling/*.safety
          git diff --cached --quiet || git commit -m "minor-rc: safeties locked, verdict ${SAFETY_VERDICT}"
          git push origin HEAD:${{ github.ref }}
      - name: Test the release tooling
        working-directory: bin/release_tooling
        run: python -B -m unittest discover -s tests -t .
      - name: Enforce the verdict
        run: |
          echo "$SAFETY_VERDICT_MESSAGE"
          if [ "$SAFETY_VERDICT" != "ALLOW" ]; then
            echo "::error::$SAFETY_VERDICT_MESSAGE"
            exit 1
          fi

  test:
    needs: safety
    strategy:
      # The outer loop is over the systems, the inner one over the
      # Pythons. Every row runs to its end, also after another row has
      # failed, so one press shows where the tests pass and where they
      # do not. A release needs every row to pass.
      fail-fast: false
      matrix:
        include:
          # Linux.
          - { python-version: '3.7', os: ubuntu-22.04 }
          - { python-version: '3.8', os: ubuntu-22.04 }
          - { python-version: '3.9', os: ubuntu-22.04 }
          - { python-version: '3.10', os: ubuntu-latest }
          - { python-version: '3.11', os: ubuntu-latest }
          - { python-version: '3.12', os: ubuntu-latest }
          - { python-version: '3.13', os: ubuntu-latest }
          - { python-version: '3.14', os: ubuntu-latest }
          - { python-version: '3.15', os: ubuntu-latest }
          # mac on Apple's own chips. There is no Python 3.7 for them.
          - { python-version: '3.8', os: macos-latest }
          - { python-version: '3.9', os: macos-latest }
          - { python-version: '3.10', os: macos-latest }
          - { python-version: '3.11', os: macos-latest }
          - { python-version: '3.12', os: macos-latest }
          - { python-version: '3.13', os: macos-latest }
          - { python-version: '3.14', os: macos-latest }
          - { python-version: '3.15', os: macos-latest }
          # mac on Intel chips.
          - { python-version: '3.7', os: macos-26-intel }
          - { python-version: '3.8', os: macos-26-intel }
          - { python-version: '3.9', os: macos-26-intel }
          - { python-version: '3.10', os: macos-26-intel }
          - { python-version: '3.11', os: macos-26-intel }
          - { python-version: '3.12', os: macos-26-intel }
          - { python-version: '3.13', os: macos-26-intel }
          - { python-version: '3.14', os: macos-26-intel }
          - { python-version: '3.15', os: macos-26-intel }
          # Windows.
          - { python-version: '3.7', os: windows-latest }
          - { python-version: '3.8', os: windows-latest }
          - { python-version: '3.9', os: windows-latest }
          - { python-version: '3.10', os: windows-latest }
          - { python-version: '3.11', os: windows-latest }
          - { python-version: '3.12', os: windows-latest }
          - { python-version: '3.13', os: windows-latest }
          - { python-version: '3.14', os: windows-latest }
          - { python-version: '3.15', os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The tests call Qt for real, so Qt has to be on the machine, in
      # the very release the ritual files were written from: an older Qt
      # lacks functions the rituals call, and the Qt that Ubuntu offers
      # is older. This step fetches the ready-made files of that release,
      # for the system of the row, from Qt's own servers and puts its
      # 'qmake6' on the path.
      # 'archives' keeps it to what the tests use: 'qtbase' holds QtCore,
      # QtGui and QtWidgets, and 'icu' is a library that QtCore opens on
      # Linux. The other systems have no such archive and pass it over.
      # 'install-deps' would fetch system libraries on Linux that only
      # QtGui and the parts above it open.
      # 'aqtsource' names the fetcher, 'aqtinstall', at one commit of its
      # source. Its last release, 3.3.0, does not find Qt 6.11 or newer
      # for Windows, where Qt has moved its files to other folders.
      # The step brings a Python of its own to do the fetching, so it
      # must stand above the step that sets up the Python of the matrix:
      # the Python set up last is the one that runs.
      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.12.0'
          archives: 'qtbase icu'
          install-deps: false
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Stops here when the Python or the Qt the tests are about to run
      # with is not the one this job names, and shows the compiler that
      # builds the rituals. It names 'bash' so the same lines run on
      # Windows, and 'tr' takes away the line ending Windows adds.
      - name: Check the Python, the Qt and the compiler
        shell: bash
        run: |
          python --version | grep -F 'Python ${{ matrix.python-version }}.'
          qmake6 -query QT_VERSION | tr -d '\r' | grep -Fx '6.12.0'
          clang++ --version
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest discover -s tests
      - name: Coverage (Linux, 3.15 only)
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.15' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pip install pytest pytest-cov
          pytest --cov --cov-branch --cov-report=xml --cov-fail-under=100
      - name: Upload coverage to Codecov
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.15' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AsgerJon/cutienator

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing (OIDC) to PyPI
      contents: write   # push the version bump and cut the release
    steps:
      # The branch tip rather than the commit the button was pressed on:
      # the version commit below has to sit on top of the lock commit the
      # 'safety' job pushed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      # Compute the next rc version from VERSION and expose it as
      # VERSION_INFO in the environment for the steps below.
      - name: Resolve next version
        run: python bin/release_tooling/version_get.py minor-rc VERSION_INFO

      # Write VERSION_INFO into pyproject.toml (the build reads its
      # version from there), into src/cutienator/__init__.py (so
      # 'cutienator.__version__' matches the published version) and into
      # the README.md heading.
      - name: Stamp version into pyproject, package and README
        run: python bin/release_tooling/version_stamp.py VERSION_INFO

      # Refresh the cumulative token-usage badge in the README from the
      # canonical count in token_stats.json.
      - name: Stamp token-usage badge into README
        run: python bin/release_tooling/token_stamp.py

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Only reached if the publish above succeeded: advance the
      # counters in VERSION, then commit VERSION + the stamped files.
      - name: Bump version counters
        run: python bin/release_tooling/version_bump.py minor-rc

      - name: Commit version changes
        run: |
          git config user.name "Asger Jon Vistisen"
          git config user.email "asgerjon2@gmail.com"
          git add bin/release_tooling/VERSION bin/release_tooling/token_stats.json pyproject.toml src/cutienator/__init__.py README.md
          git commit -m "rc ${{ env.VERSION_INFO }}"
          git push origin HEAD:${{ github.ref }}

      - name: GitHub pre-release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ env.VERSION_INFO }}
          name: rc ${{ env.VERSION_INFO }}
          prerelease: true
          generateReleaseNotes: true
